# docker-compose 파일은 실행 레시피 같은 것이다. 도커 이미지를 어떤 설정으로 실행할지 정의
# Dockerfile은 이미지(=실행 패키지)를 어떻게 만들지 를 정의한다.
services:
  postgres:
    image: postgres:16
    container_name: cosmoslog-postgres-local
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata_local:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata_local:


